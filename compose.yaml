services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: movie-recommender-postgres
    environment:
      POSTGRES_DB: movie_recommender
      POSTGRES_USER: movie_recommender
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_recommender -d movie_recommender"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: